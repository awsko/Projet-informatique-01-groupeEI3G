
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Game</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #d9efff;
            color: #111;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            width: 85%;
            max-width: 1000px;
            height: 550px;
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Partie gauche : inscription */
        .login {
            width: 40%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login p {
            color: #777;
            margin-bottom: 30px;
        }

        input {
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            padding: 15px;
            background-color: #80caff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #111;
            margin-top: 10px;
        }

        /* Partie droite : présentation */
        .presentation {
            width: 60%;
            background-color: #a9ddff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .presentation h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .presentation p {
            font-size: 17px;
        }

        .game-image {
            font-size: 100px;
            margin: 20px;
        }

        .footer {
            font-size: 12px;
            color: #555;
            margin-top: 30px;
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- Partie inscription -->
        <div class="login">

            <h2>Créer ton compte</h2>

            <p>Inscris-toi pour rejoindre l'aventure !</p>

            <input type="text" placeholder="Choisis ton pseudo">

            <input type="password" placeholder="Choisis ton mot de passe">

            <button>CRÉER MON COMPTE</button>

            <div class="footer">
                Prépare-toi à relever le défi !
            </div>

        </div>

        <!-- Présentation du jeu -->
        <div class="presentation">

            <h1>SKY JUMP</h1>

            <p>Saute, explore et dépasse tes limites !</p>

            <div class="game-image">
                🕹️
            </div>

            <h2>YOUR ADVENTURE STARTS HERE</h2>

            <p>Un monde rempli de défis t'attend.</p>

        </div>

    </div>

</body>
</html>
