<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#000000">
	<title>Noir — Un instant de calme</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: #000;
			color: #f5f5f5;
		}
		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; }
		main {
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 2rem;
			background: radial-gradient(ellipse at center, #171717 0%, #080808 48%, #000 78%);
			text-align: center;
		}
		.intro { max-width: 620px; }
		.label {
			margin: 0 0 1.25rem;
			color: #a3a3a3;
			font-size: .75rem;
			font-weight: 600;
			letter-spacing: .24em;
			text-transform: uppercase;
		}
		h1 {
			margin: 0;
			font-size: clamp(4rem, 14vw, 8rem);
			font-weight: 300;
			letter-spacing: -.09em;
			line-height: 1;
		}
		.description {
			margin: 1.5rem auto 0;
			color: #aaa;
			font-size: clamp(1rem, 2.5vw, 1.15rem);
			line-height: 1.8;
		}
		.rule {
			width: 3rem;
			height: 1px;
			margin: 2rem auto 0;
			border: 0;
			background: #666;
		}
		footer {
			position: absolute;
			right: 1.5rem;
			bottom: 1.25rem;
			left: 1.5rem;
			color: #666;
			font-size: .75rem;
			letter-spacing: .08em;
			text-align: center;
		}
	</style>
</head>
<body>
	<main>
		<section class="intro" aria-labelledby="page-title">
			<p class="label">Un instant de calme</p>
			<h1 id="page-title">Noir.</h1>
			<p class="description">Laissez le bruit du monde derrière vous.<br>Respirez. Prenez votre temps.</p>
			<hr class="rule">
		</section>
	</main>
	<footer>FAIT POUR RALENTIR</footer>
</body>
</html>
